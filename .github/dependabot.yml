version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # vue-tsc does not support the native TypeScript 7 compiler yet (see #9).
      - dependency-name: typescript
        versions: [">=7"]
      # Keep Node type definitions on the Node major in .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/, /packages/updater]
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # Keep the Node image on the Node major in .nvmrc.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
